# Automated PR review by Claude Code.
#
# Rebuilt from scratch on 2026-09-13 on the current claude-code-action release.
# Two things to know when this check is red:
# 1. The action refuses to run when the PR's copy of this file differs from the
#    copy on main. A PR that edits this workflow therefore fails this check until
#    it is merged. That is the action's own safeguard, not a bug in the PR.
# 2. The Bun message "Internal error: directory mismatch ... You don't need to do
#    anything" in the log is noise from the action's runtime and is not the cause
#    of a failure.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Same-repo, non-draft, human-authored PRs only. Fork PRs cannot read the
    # OAuth secret, and dependabot bumps are reviewed by CI alone.
    if: |
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6  # v1.0.234
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for claude-agents, a plugin
            marketplace that ships one Markdown source to seven harnesses:
            Claude Code, OpenAI Codex CLI, Cursor, OpenCode, the Google
            Antigravity CLI, GitHub Copilot, and Pi. The source of truth is
            `plugins/`. The trees under `.codex/`, `.opencode/`, `.copilot/`,
            `.antigravity/`, and the `skills/`, `prompts/`, and `agents/`
            subdirectories of `.pi/` are generated by `make generate` and are
            gitignored. The small registries under `.agents/plugins/`,
            `.cursor-plugin/`, `.cursor/rules/`, and `plugins/*/.codex-plugin/`
            are generated by `make generate-all` and committed, so a change to
            them is fine when it comes from the generator and wrong when it is
            typed by hand.

            Many contributors are outside the project, and some represent
            vendors, so the commercial and external-service rules in
            `CONTRIBUTING.md` matter as much as code quality here.

            Read `AGENTS.md` at the repo root first. Use `docs/authoring.md`
            for frontmatter shapes, `docs/harnesses.md` for what each harness
            supports, `docs/plugins.md` for the catalog, and `CONTRIBUTING.md`
            for the contribution rules.

            Start from the linked issue (`Closes #N` in the PR body), read with
            `gh issue view`. Check that the change does what the issue asked
            and nothing unrelated. A new plugin, agent, skill, or command needs
            a proposal issue that a maintainer answered before the PR opened.

            ## What to check

            1. Source of truth. Hand edits belong in `plugins/`,
               `.claude-plugin/marketplace.json`, `docs/`, `tools/`,
               `.github/`, the `Makefile`, and the top-level Markdown files.
               Flag any hand edit to a generated tree or registry.

            2. Frontmatter. Every agent under `plugins/*/agents/*.md` needs
               `name`, `description`, and a `model` tier. Every skill under
               `plugins/*/skills/*/SKILL.md` needs `name` and `description`,
               and `name` must equal the directory name. Plugin directory
               names are lowercase and hyphen separated and never contain
               `__`, which is the adapter namespace separator.

            3. Portability. Content should work on every harness unless
               `docs/harnesses.md` says the feature is Claude Code only.
               Watch for hard dependencies on `TodoWrite`, the `Task` or
               `Agent` spawn tool, or per-agent `tools:` allowlists with no
               fallback. A locked agent (`tools: []`) is handled specially by
               the OpenCode and Pi adapters, so keep that contract.

            4. Codex skill cap. A `SKILL.md` body should stay under 8 KB.
               Detail belongs in `references/`. `make garden` reports
               oversize skills.

            5. Context file. `AGENTS.md` is the only hand-authored context
               file and `CLAUDE.md` is a symlink to it. It must stay under
               150 lines.

            6. Quality gates. CI runs `make validate STRICT=1`, `make garden`,
               `make test`, and `make smoke-test` on every PR, and this job
               can't run them. Read the results with `gh pr checks`. If a gate
               failed, name it and point to the cause in the diff. If the
               gates haven't finished, say which gate the change could break
               and why.

            7. Catalog counts. Added, removed, or renamed plugins, agents,
               skills, or commands must be reflected in `docs/plugins.md`,
               `docs/agents.md`, `docs/agent-skills.md`, `AGENTS.md`, and
               `README.md`. `make garden` checks the totals.

            8. Python tooling. Code under `tools/` uses uv, ruff, and ty.
               Flag `pip`, `requirements.txt`, `mypy`, or `black`. Watch for
               unhandled errors in adapter code, broken JSON in manifests,
               and missing tests under `tools/tests/`.

            9. Security. No secrets in code or workflows. No destructive git
               in scripts. No shell injection in hook scripts or `Bash(...)`
               allowlists. New workflows pin action SHAs and set
               `persist-credentials: false`, as `validate.yml` does.

            10. Commercial content and external services. Apply the
                "Commercial content and disclosure" and "External and vendor
                plugins" sections of `CONTRIBUTING.md`. Flag a component that
                calls or recommends a service its author runs without saying
                so, a free tier with a paid tier behind it on the default
                path, workspace data sent to a third party when a first-party
                source answers the same question, payment or license tooling
                in the payload, requests to star a repo, and telemetry.

            ## How to report

            - Use the inline comment tool for findings tied to a line, and
              mark each one as blocking or non-blocking.
            - Post one summary comment with `gh pr comment`. Lead with whether
              anything blocks the merge, then list only the findings that
              matter, so a maintainer can scan it. If there is nothing
              important, post a single line saying the review found no
              blocking issues, and stop. Don't submit a formal review
              approval, because maintainers approve.
            - Read the existing review comments first with
              `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
              and
              `gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments`,
              and don't repeat a finding that `coderabbitai` or
              `chatgpt-codex-connector` already raised.
            - Report only what you checked. Don't list commands you couldn't
              run.
            - Skip formatting, import order, and naming style. ruff and ty
              cover those.
            - Don't ask for extra documentation unless a public count or a
              catalog entry is wrong.
            - Prefer a suggestion block over prose when the fix is small.

          claude_args: |
            --model claude-opus-5-5
            --effort high
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(gh api repos/*/pulls/*/comments:*),Bash(gh api repos/*/issues/*/comments:*)"
