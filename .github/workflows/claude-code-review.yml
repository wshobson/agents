# Automated PR review by Claude Code.
#
# Rebuilt from scratch on 2026-09-13 on the current claude-code-action release.
# Two things to know when this check is red:
# 1. The action refuses to run when the PR's copy of this file differs from the
#    copy on main. A PR that edits this workflow therefore fails this check until
#    it is merged. That is the action's own safeguard, not a bug in the PR.
# 2. The Bun message "Internal error: directory mismatch ... You don't need to do
#    anything" in the log is noise from the action's runtime and is not the cause
#    of a failure.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Same-repo, non-draft, human-authored PRs only. Fork PRs cannot read the
    # OAuth secret, and dependabot bumps are reviewed by CI alone.
    if: |
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@9cdae7f0d995e3ba7c33f226087fdf82a59cd520  # v1.0.223
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for claude-agents, a plugin
            marketplace that ships one Markdown source to seven harnesses:
            Claude Code, OpenAI Codex CLI, Cursor, OpenCode, the Google
            Antigravity CLI, GitHub Copilot, and Pi. The source of truth is
            `plugins/`. The trees under `.codex/`, `.opencode/`, `.copilot/`,
            `.antigravity/`, and the `skills/`, `prompts/`, and `agents/`
            subdirectories of `.pi/` are generated by `make generate` and are
            gitignored. The small registries under `.agents/plugins/`,
            `.cursor-plugin/`, `.cursor/rules/`, and `plugins/*/.codex-plugin/`
            are generated by `make generate-all` and committed, so a change to
            them is fine when it comes from the generator and wrong when it is
            typed by hand.

            Read `AGENTS.md` at the repo root first. Use `docs/authoring.md`
            for frontmatter shapes, `docs/harnesses.md` for what each harness
            supports, and `docs/plugins.md` for the catalog.

            ## What to check

            1. Source of truth. Hand edits belong in `plugins/`,
               `.claude-plugin/marketplace.json`, `docs/`, `tools/`,
               `.github/`, the `Makefile`, and the top-level Markdown files.
               Flag any hand edit to a generated tree or registry.

            2. Frontmatter. Every agent under `plugins/*/agents/*.md` needs
               `name`, `description`, and a `model` tier. Every skill under
               `plugins/*/skills/*/SKILL.md` needs `name` and `description`,
               and `name` must equal the directory name. Plugin directory
               names are lowercase and hyphen separated and never contain
               `__`, which is the adapter namespace separator.

            3. Portability. Content should work on every harness unless
               `docs/harnesses.md` says the feature is Claude Code only.
               Watch for hard dependencies on `TodoWrite`, the `Task` or
               `Agent` spawn tool, or per-agent `tools:` allowlists with no
               fallback. A locked agent (`tools: []`) is handled specially by
               the OpenCode and Pi adapters, so keep that contract.

            4. Codex skill cap. A `SKILL.md` body should stay under 8 KB.
               Detail belongs in `references/`. `make garden` reports
               oversize skills.

            5. Context file. `AGENTS.md` is the only hand-authored context
               file and `CLAUDE.md` is a symlink to it. It must stay under
               150 lines.

            6. Quality gates. Say whether the change could break
               `make validate STRICT=1`, `make garden`, `make test`, or
               `make smoke-test`, and name the gate.

            7. Catalog counts. Added, removed, or renamed plugins, agents,
               skills, or commands must be reflected in `docs/plugins.md`,
               `docs/agents.md`, `docs/agent-skills.md`, `AGENTS.md`, and
               `README.md`. `make garden` checks the totals.

            8. Python tooling. Code under `tools/` uses uv, ruff, and ty.
               Flag `pip`, `requirements.txt`, `mypy`, or `black`. Watch for
               unhandled errors in adapter code, broken JSON in manifests,
               and missing tests under `tools/tests/`.

            9. Security. No secrets in code or workflows. No destructive git
               in scripts. No shell injection in hook scripts or `Bash(...)`
               allowlists. New workflows pin action SHAs and set
               `persist-credentials: false`, as `validate.yml` does.

            ## How to report

            - Use the inline comment tool for findings tied to a line.
            - Post one short summary comment with `gh pr comment`, ten lines
              or fewer. If there is nothing important, post a single line
              saying the review found no blocking issues, and stop. Do not
              try to submit a formal review approval.
            - Read the existing comments first with
              `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
              and do not repeat what `coderabbitai` already said.
            - Skip formatting, import order, and naming style. ruff and ty
              cover those.
            - Do not ask for extra documentation unless a public count or a
              catalog entry is wrong.
            - One sentence per finding. Prefer a diff block over prose.

          claude_args: |
            --model claude-opus-5
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/*/pulls/*/comments:*)"
